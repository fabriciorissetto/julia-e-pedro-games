<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peixinho no Aquário</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #001a33;
    overflow: hidden;
    height: 100%;
    font-family: -apple-system, sans-serif;
    touch-action: none;
  }
  #game { width: 100vw; height: 100vh; }
  #voltar {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 30;
    background: rgba(255,255,255,0.85);
    color: #b56fff;
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  /* tela de escolher o nome */
  #tela-nome {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 16px;
    background: linear-gradient(180deg, #6fc8ff, #3c8cdc);
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
  }
  #tela-nome .peixes { font-size: 64px; animation: nadar 1.6s ease-in-out infinite alternate; }
  @keyframes nadar { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
  #tela-nome .pergunta {
    font-size: 34px;
    font-weight: bold;
    color: white;
    text-shadow: 0 3px 0 #b56fff, 0 0 12px rgba(0,0,0,0.2);
    text-align: center;
  }
  #nome {
    font-size: 34px;
    font-family: inherit;
    font-weight: bold;
    text-align: center;
    color: #b56fff;
    width: min(320px, 86vw);
    padding: 12px;
    border: 5px solid #ff9bd3;
    border-radius: 24px;
    outline: none;
    text-transform: uppercase;
  }
  #nome.balanca { animation: balanca 0.4s; }
  @keyframes balanca { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  #btn-jogar {
    font-size: 32px;
    font-family: inherit;
    font-weight: bold;
    color: white;
    padding: 14px 40px;
    border: 5px solid white;
    border-radius: 30px;
    background: linear-gradient(135deg, #5fd27a, #2fae5a);
    box-shadow: 0 5px 14px rgba(0,0,0,0.25);
    cursor: pointer;
  }
  #btn-jogar:active { transform: scale(0.95); }

  /* botão grande com a primeira letra do nome (pra lutar no celular) */
  #btn-atacar {
    display: none;
    position: fixed;
    right: 20px;
    bottom: 24px;
    z-index: 10;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 5px solid white;
    background: radial-gradient(circle at 35% 30%, #ff9bd3, #e0337a);
    color: white;
    font-size: 48px;
    font-weight: bold;
    font-family: "Trebuchet MS", Arial, sans-serif;
    box-shadow: 0 0 0 6px rgba(255,111,181,0.35), 0 6px 16px rgba(0,0,0,0.35);
    cursor: pointer;
    touch-action: none;
    animation: brilhar 1s ease-in-out infinite alternate;
  }
  #btn-atacar:active { transform: scale(0.9); }
  @keyframes brilhar { to { box-shadow: 0 0 0 14px rgba(255,111,181,0.15), 0 6px 16px rgba(0,0,0,0.35); } }
</style>
</head>
<body>
<button id="voltar" onclick="window.location.href='/julia/'">← Voltar</button>
<div id="game"></div>
<div id="tela-nome">
  <div class="peixes">🐠 🦈 🐟</div>
  <div class="pergunta">Qual é o seu nome?</div>
  <input id="nome" type="text" maxlength="12" autocomplete="off" placeholder="Seu nome">
  <button id="btn-jogar">▶ Jogar</button>
</div>
<button id="btn-atacar"></button>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
const W = window.innerWidth;
const H = window.innerHeight;
const PEQUENO = W < 520;

// nome escolhido na tela inicial; a primeira letra dele é a tecla de lutar
let NOME = '', LETRA = '', IMUNE = false;
// nomes mágicos (regra da Julia): quem escolhe esses nunca é pego pelo tubarão
const NOMES_MAGICOS = ['67', '42', 'AURA'];
const semAcento = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();

// ===== regras do jogo (combinadas com a Julia) =====
const TOTAL_DIAS = 20;          // tem que sobreviver 20 dias
const TOTAL_CORACOES = 20;      // só tem 20 corações no jogo todo
const COMIDAS_POR_OVO = 5;      // a cada 5 comidas: fica mais forte e bota um ovo
const DURACAO = {               // em milissegundos
  manha: 8000,
  almoco: 25000,
  tarde: 8000,
  noite: 5 * 60 * 1000,         // a noite dura 5 minutos (ou até derrotar o tubarão)
};
const DURACAO_DIA = DURACAO.manha + DURACAO.almoco + DURACAO.tarde;
const CHAVE = 'jp-aquario-v2';
const FONTE = '"Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif';

class Aquario extends Phaser.Scene {
  constructor() { super('Aquario'); }

  create() {
    this.audioCtx = null;
    this.desenharFundo();

    // céu/relógio em cima do aquário (faixa onde o sol e a lua andam)
    this.faixaCeu = this.add.rectangle(W / 2, 35, W, 70, 0xffe7a8, 0.4).setDepth(49);
    this.sol = this.add.text(0, 35, '☀️', { fontSize: '40px' }).setOrigin(0.5).setDepth(60);
    this.lua = this.add.text(0, 35, '🌙', { fontSize: '36px' }).setOrigin(0.5).setDepth(60).setVisible(false);

    this.criarDona();
    this.criarPeixe();

    // peixinhos amigos (decoração) e filhotes que nascem dos ovos
    this.amigos = [];
    const cores = [[0xffd16f, 0xffe7a8], [0x6fb5ff, 0xa8d2ff], [0xb56fff, 0xd2a8ff]];
    for (let i = 0; i < 3; i++) this.criarAmigo(cores[i][0], cores[i][1], 0.7);

    // bolhinhas
    this.time.addEvent({ delay: 600, loop: true, callback: () => this.criarBolha() });

    // comidinhas
    this.comidas = [];
    this.time.addEvent({ delay: 1200, loop: true, callback: () => { if (this.fase === 'almoco' && !this.fimDeJogo) this.donaJogaComida(); } });
    this.time.addEvent({ delay: 5000, loop: true, callback: () => { if (this.fase === 'almoco') this.donaFala(['Vem comer!', 'Olha o lanche!', 'Nhami nhami!', 'Pega pega!']); } });

    // ===== escuridão da noite + lanterna =====
    // uma "tinta preta" por cima de tudo, com um buraco de luz em volta do peixinho
    this.criarTexturaLuz();
    this.escuroRT = this.add.renderTexture(0, 0, W, H).setOrigin(0).setDepth(50).setVisible(false);
    this.luzPeixe = this.make.image({ key: 'luz', add: false });
    this.luzTubarao = this.make.image({ key: 'luz', add: false });
    this.cone = this.make.graphics({ add: false });
    this.escuro = 0;

    // ===== tubarão =====
    this.criarTubarao();

    // ===== placar (fica por cima do escuro) =====
    const estilo = (tam, borda) => ({ fontSize: tam + 'px', color: '#ffffff', fontStyle: 'bold', fontFamily: FONTE, stroke: borda, strokeThickness: 5, align: 'center' });
    const fs = PEQUENO ? 18 : 24;
    this.hud1 = this.add.text(W / 2, 92, '', estilo(fs, '#b56fff')).setOrigin(0.5).setDepth(70);
    this.hud2 = this.add.text(W / 2, 92 + fs + 12, '', estilo(fs, '#ff6fb5')).setOrigin(0.5).setDepth(70);
    this.textoHora = this.add.text(W / 2, 92 + (fs + 12) * 2 + 4, '', estilo(PEQUENO ? 20 : 26, '#3366aa')).setOrigin(0.5).setDepth(70);
    this.barraTubarao = this.add.graphics().setDepth(70);
    this.iconeBarra = null;
    this.yBarra = this.textoHora.y + 26;

    // ===== estado do jogo (continua de onde parou) =====
    this.dia = 1;
    this.coracoes = TOTAL_CORACOES;
    this.comeu = 0;
    this.forca = 1;
    this.ovos = 0;
    this.filhotes = 0;
    this.carregar();
    for (let i = 0; i < Math.min(this.filhotes, 10); i++) this.criarFilhote(W / 2 + Phaser.Math.Between(-150, 150), Phaser.Math.Between(200, H - 120));
    this.ajustarTamanhoPeixe(false);

    this.fimDeJogo = false;
    this.invulneravel = 0;
    this.dash = null;
    this.recargaDash = 0;
    this.comecarFase('manha');
    this.mostrarFaixa(this.dia === 1 && this.comeu === 0 ? '☀️ Dia 1! Sobreviva 20 dias!' : `☀️ Dia ${this.dia}!`);

    // ===== controles: setas/mouse/toque pra nadar, espaço ou tocar no tubarão pra atacar =====
    this.cursors = this.input.keyboard.createCursorKeys();
    // lutar = apertar a primeira letra do nome
    this.input.keyboard.on('keydown', (e) => { if (e.key && semAcento(e.key) === LETRA) this.atacar(); });
    this.alvo = null;
    this.input.on('pointerdown', (p) => {
      if (this.fimDeJogo) return;
      const t = this.tubarao;
      if (t.ativo && Phaser.Math.Distance.Between(p.x, p.y, t.x, t.y) < 90 * t.escala) {
        this.atacar(t.x, t.y);
      }
      this.alvo = { x: p.x, y: p.y };
    });
    this.input.on('pointermove', (p) => { if (p.isDown && !this.fimDeJogo) this.alvo = { x: p.x, y: p.y }; });

    this.atualizarHUD();
  }

  // ================= DESENHOS =================

  desenharFundo() {
    const grad = this.add.graphics();
    for (let i = 0; i < H; i += 2) {
      const t = i / H;
      const r = Math.floor(110 + (60 - 110) * t);
      const g = Math.floor(200 + (140 - 200) * t);
      const b = Math.floor(255 + (220 - 255) * t);
      grad.fillStyle((r << 16) | (g << 8) | b, 1);
      grad.fillRect(0, i, W, 2);
    }
    const luz = this.add.graphics();
    luz.fillStyle(0xffffff, 0.08);
    for (let i = 0; i < 5; i++) {
      const x = Phaser.Math.Between(50, W - 50);
      luz.fillTriangle(x, 0, x - 30, H * 0.6, x + 30, H * 0.6);
    }
    const areia = this.add.graphics();
    areia.fillStyle(0xffe9b0, 1);
    areia.fillEllipse(W / 2, H + 30, W * 1.4, 120);
    areia.fillStyle(0xffd98a, 1);
    for (let i = 0; i < 30; i++) areia.fillCircle(Phaser.Math.Between(0, W), H - Phaser.Math.Between(5, 25), Phaser.Math.Between(2, 5));
    [[80, 40, 0x3fa86a], [W - 100, 50, 0x5ec97f], [W / 2 - 60, 35, 0x3fa86a], [W / 2 + 80, 45, 0x5ec97f], [W / 4, 40, 0x5ec97f], [W * 0.75, 35, 0x3fa86a]]
      .forEach(([x, dy, c]) => this.desenharPlanta(x, H - dy, c));
    for (let i = 0; i < 8; i++) {
      const cor = Phaser.Utils.Array.GetRandom([0xff9bd3, 0xb56fff, 0xffd16f, 0xffffff]);
      this.add.circle(Phaser.Math.Between(20, W - 20), H - Phaser.Math.Between(10, 25), Phaser.Math.Between(6, 12), cor);
    }
  }

  desenharPlanta(x, y, cor) {
    const g = this.add.graphics();
    g.fillStyle(cor, 1);
    for (let i = 0; i < 5; i++) g.fillEllipse(x + Math.sin(i) * 8, y - i * 18, 16 - i * 2, 28);
    this.tweens.add({ targets: g, angle: 4, duration: 2000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
  }

  desenharPeixe(g, corPrincipal, corClara) {
    g.clear();
    g.fillStyle(corPrincipal, 1);
    g.fillEllipse(0, 0, 40, 24);
    g.fillStyle(corClara, 1);
    g.fillEllipse(0, 4, 30, 14);
    g.fillStyle(corPrincipal, 1);
    g.fillTriangle(-18, 0, -30, -10, -30, 10);
    g.fillTriangle(-2, -10, -10, -18, 6, -12);
    g.fillTriangle(-2, 10, -10, 16, 6, 12);
  }

  criarPeixe() {
    this.peixe = this.add.container(W / 2, H / 2).setDepth(40);
    this.peixeCorpo = this.add.graphics();
    this.desenharPeixe(this.peixeCorpo, 0xff6fb5, 0xff9bd3);
    this.peixeOlho = this.add.circle(8, -3, 4, 0xffffff);
    this.peixePupila = this.add.circle(9, -3, 2, 0x222222);
    // coroinha de força aparece quando fica bem forte
    this.peixeCoroa = this.add.text(2, -22, '👑', { fontSize: '14px' }).setOrigin(0.5).setVisible(false);
    this.peixe.add([this.peixeCorpo, this.peixeOlho, this.peixePupila, this.peixeCoroa]);
    this.tamanhoPeixe = 1;
  }

  criarAmigo(cor, clara, escala) {
    const a = this.add.container(Phaser.Math.Between(80, W - 80), Phaser.Math.Between(200, H - 120)).setDepth(30);
    const corpo = this.add.graphics();
    this.desenharPeixe(corpo, cor, clara);
    a.add([corpo, this.add.circle(8, -3, 3, 0xffffff), this.add.circle(9, -3, 1.5, 0x222222)]);
    a.escala = escala;
    a.dirX = Phaser.Math.Between(0, 1) ? 1 : -1;
    a.velocidade = Phaser.Math.FloatBetween(0.5, 1.2);
    a.setScale(escala * a.dirX, escala);
    this.amigos.push(a);
    return a;
  }

  criarFilhote(x, y) {
    const f = this.criarAmigo(0xff6fb5, 0xffc2dd, 0.42);
    f.x = x; f.y = y;
    f.velocidade = Phaser.Math.FloatBetween(0.8, 1.5);
    return f;
  }

  criarDona() {
    this.donaPosDireita = { x: W - 60, y: H / 2 };
    this.donaPosCima = { x: W / 2, y: 50 };
    this.donaPosNoite = { x: PEQUENO ? W - 36 : W * 0.78, y: 50 };
    this.dona = this.add.container(this.donaPosDireita.x, this.donaPosDireita.y).setDepth(60);
    this.donaAlvo = { ...this.donaPosDireita };
    const cabelo = this.add.graphics();
    cabelo.fillStyle(0xffcc4d, 1);
    cabelo.fillEllipse(0, -14, 56, 30);
    cabelo.fillEllipse(-22, -2, 18, 20);
    cabelo.fillEllipse(22, -2, 18, 20);
    const cabeca = this.add.circle(0, 0, 28, 0xffd6b5);
    const sorriso = this.add.graphics();
    sorriso.lineStyle(2, 0x884422, 1);
    sorriso.beginPath();
    sorriso.arc(0, 12, 6, 0, Math.PI, false);
    sorriso.strokePath();
    const braco = this.add.graphics();
    braco.fillStyle(0xffd6b5, 1);
    braco.fillRoundedRect(-6, 18, 12, 20, 4);
    // pote de ração (de dia) e lanterna (de noite)
    this.poteDona = this.add.container(0, 45);
    this.poteDona.add([this.add.rectangle(0, 0, 36, 22, 0xff6fb5), this.add.rectangle(0, -10, 40, 6, 0xb53fa0),
      this.add.text(0, 0, '🐟', { fontSize: '14px' }).setOrigin(0.5)]);
    this.lanterna = this.add.text(0, 46, '🔦', { fontSize: '30px' }).setOrigin(0.5).setAngle(100).setVisible(false);
    this.dona.add([cabelo, cabeca, this.add.circle(-8, 2, 3, 0x222222), this.add.circle(8, 2, 3, 0x222222),
      this.add.circle(-12, 10, 4, 0xff9bb5, 0.7), this.add.circle(12, 10, 4, 0xff9bb5, 0.7), sorriso, braco, this.poteDona, this.lanterna]);

    // balãozinho de fala
    this.nuvem = this.add.container(0, 0).setDepth(61).setAlpha(0);
    const balao = this.add.graphics();
    balao.fillStyle(0xffffff, 0.92);
    balao.fillRoundedRect(-75, -18, 150, 36, 12);
    this.balaoTexto = this.add.text(0, 0, '', { fontSize: '16px', color: '#b56fff', fontStyle: 'bold', fontFamily: FONTE }).setOrigin(0.5);
    this.nuvem.add([balao, this.balaoTexto]);
  }

  criarTubarao() {
    const t = this.add.container(-200, H * 0.6).setDepth(45);
    const g = this.add.graphics();
    // rabo
    g.fillStyle(0x6c7a89, 1);
    g.fillTriangle(-56, 0, -92, -34, -80, 0);
    g.fillTriangle(-56, 0, -80, 0, -90, 30);
    // corpo
    g.fillEllipse(0, 0, 132, 56);
    g.fillTriangle(-14, -24, 14, -24, -20, -56); // barbatana de cima
    g.fillTriangle(-2, 18, 22, 18, -12, 42);     // barbatana de baixo
    // barriga clara
    g.fillStyle(0xe8eef3, 1);
    g.fillEllipse(12, 11, 98, 24);
    // guelras
    g.lineStyle(2, 0x4a5866, 1);
    for (const x of [18, 25, 32]) { g.beginPath(); g.moveTo(x, -10); g.lineTo(x - 3, 6); g.strokePath(); }
    // boca com dentinhos
    g.lineStyle(3, 0x3a2a2a, 1);
    g.beginPath(); g.moveTo(34, 12); g.lineTo(62, 6); g.strokePath();
    g.fillStyle(0xffffff, 1);
    for (let i = 0; i < 4; i++) { const x = 38 + i * 6; g.fillTriangle(x, 11 - i * 1.2, x + 4, 10 - i * 1.2, x + 2, 16 - i * 1.2); }
    t.add(g);
    // olho brilhante (aparece mesmo no escuro)
    this.olhoTubarao = this.add.container(0, 0).setDepth(56).setVisible(false);
    this.olhoTubarao.add([this.add.circle(0, 0, 8, 0xfff27a, 0.35), this.add.circle(0, 0, 5, 0xfff27a), this.add.circle(1, 0, 2.5, 0x111111)]);
    // avisos em cima do tubarão (❗ vai atacar, 💫 cansado)
    this.avisoTubarao = this.add.text(0, 0, '', { fontSize: '30px' }).setOrigin(0.5).setDepth(57);
    t.ativo = false;
    t.escala = PEQUENO ? 0.8 : 1;
    t.setScale(t.escala);
    t.setVisible(false);
    this.tubarao = t;
  }

  criarTexturaLuz() {
    if (this.textures.exists('luz')) return;
    const tex = this.textures.createCanvas('luz', 320, 320);
    const ctx = tex.getContext();
    const g = ctx.createRadialGradient(160, 160, 0, 160, 160, 160);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.55, 'rgba(255,255,255,0.95)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 320, 320);
    tex.refresh();
  }

  criarBolha() {
    const b = this.add.circle(Phaser.Math.Between(20, W - 20), H + 10, Phaser.Math.Between(3, 8), 0xffffff, 0.4).setDepth(20);
    b.setStrokeStyle(1, 0xffffff, 0.6);
    this.tweens.add({ targets: b, y: -20, duration: Phaser.Math.Between(4000, 7000), ease: 'Sine.easeInOut', onComplete: () => b.destroy() });
  }

  // ================= DIA E NOITE =================

  comecarFase(fase) {
    this.fase = fase;
    this.faseTempo = DURACAO[fase];
    this.lanterna.setVisible(fase === 'noite');
    this.poteDona.setVisible(fase !== 'noite');
    if (fase === 'manha' || fase === 'tarde') {
      this.donaAlvo = { ...this.donaPosDireita };
    } else if (fase === 'almoco') {
      this.donaAlvo = { ...this.donaPosCima };
      this.tweens.add({ targets: this.textoHora, scale: 1.4, duration: 300, yoyo: true, repeat: 2, ease: 'Back.easeOut' });
      this.tocarSom(660, 0.15);
      this.time.delayedCall(150, () => this.tocarSom(880, 0.15));
    } else if (fase === 'noite') {
      this.donaAlvo = { ...this.donaPosNoite };
      this.noiteAcabando = false;
      this.mostrarFaixa('🌙 Anoiteceu! Cuidado com o tubarão!');
      this.time.delayedCall(1500, () => this.donaFala(['Eu te ilumino! 🔦']));
      // o tubarão chega uns segundinhos depois de escurecer
      this.time.delayedCall(4000, () => { if (this.fase === 'noite' && !this.fimDeJogo) this.chegarTubarao(); });
    }
  }

  atualizarTempo(delta) {
    this.faseTempo -= delta;
    if (this.faseTempo <= 0) {
      if (this.fase === 'manha') this.comecarFase('almoco');
      else if (this.fase === 'almoco') this.comecarFase('tarde');
      else if (this.fase === 'tarde') this.comecarFase('noite');
      else if (this.fase === 'noite') this.acabarNoite();
    }

    // sol e lua andando na faixa do céu
    if (this.fase === 'noite') {
      const t = 1 - Math.max(0, this.faseTempo) / DURACAO.noite;
      this.lua.setPosition(30 + t * (W - 60), 35 - Math.sin(t * Math.PI) * 18).setVisible(true);
      this.sol.setVisible(false);
      this.faixaCeu.setFillStyle(0x223366, 0.6);
      const s = Math.ceil(Math.max(0, this.faseTempo) / 1000);
      this.textoHora.setText(!this.noiteAcabando ? `🌙 Noite ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : '🌅 Já vai amanhecer!');
    } else {
      let passado = DURACAO[this.fase] - this.faseTempo;
      if (this.fase !== 'manha') passado += DURACAO.manha;
      if (this.fase === 'tarde') passado += DURACAO.almoco;
      const t = Phaser.Math.Clamp(passado / DURACAO_DIA, 0, 1);
      this.sol.setPosition(30 + t * (W - 60), 35 - Math.sin(t * Math.PI) * 18).setVisible(true);
      this.lua.setVisible(false);
      this.faixaCeu.setFillStyle(0xffe7a8, 0.4);
      this.textoHora.setText({ manha: '🌅 Manhã', almoco: '🍽️ Hora do Almoço!', tarde: '🌇 Tarde' }[this.fase]);
    }
  }

  acabarNoite() {
    if (this.fimDeJogo) return;
    if (this.tubarao.ativo) this.fugirTubarao();
    if (this.dia >= TOTAL_DIAS) { this.time.delayedCall(1500, () => this.vitoria()); this.fase = 'fim'; return; }
    this.dia++;
    this.comecarFase('manha');
    this.mostrarFaixa(`☀️ Dia ${this.dia}!`);
    this.tocarMelodia([523, 659, 784, 1047], 0.12);
    this.salvar();
    this.atualizarHUD();
  }

  // desenha o escuro da noite com o buraco da lanterna
  desenharEscuro() {
    const alvo = this.fase === 'noite' ? 0.93 : 0;
    this.escuro += (alvo - this.escuro) * 0.03;
    if (this.escuro < 0.01) { this.escuroRT.setVisible(false); return; }
    const rt = this.escuroRT;
    rt.setVisible(true);
    rt.clear();
    rt.fill(0x000018, this.escuro);
    // luz da lanterna em volta do peixinho
    const r = 120 + this.tamanhoPeixe * 30;
    this.luzPeixe.setPosition(this.peixe.x, this.peixe.y).setScale(r * 2 / 320).setAlpha(1);
    rt.erase(this.luzPeixe);
    // facho da lanterna saindo da mão da dona até o peixinho
    const lx = this.dona.x, ly = this.dona.y + 50;
    const ang = Math.atan2(this.peixe.y - ly, this.peixe.x - lx);
    const px = Math.cos(ang + Math.PI / 2), py = Math.sin(ang + Math.PI / 2);
    this.cone.clear();
    this.cone.fillStyle(0xffffff, 0.3);
    this.cone.fillTriangle(lx, ly, this.peixe.x + px * r * 0.8, this.peixe.y + py * r * 0.8, this.peixe.x - px * r * 0.8, this.peixe.y - py * r * 0.8);
    rt.erase(this.cone);
    // um tiquinho de claridade em volta do tubarão, pra dar pra ver a sombra dele
    if (this.tubarao.ativo) {
      this.luzTubarao.setPosition(this.tubarao.x, this.tubarao.y).setScale(1.1 * this.tubarao.escala).setAlpha(0.35);
      rt.erase(this.luzTubarao);
    }
  }

  // ================= TUBARÃO =================

  chegarTubarao() {
    const t = this.tubarao;
    const daEsquerda = this.peixe.x > W / 2;
    t.setPosition(daEsquerda ? -150 : W + 150, Phaser.Math.Between(H * 0.4, H * 0.75));
    t.vidaMax = 6 + this.dia * 4;
    t.vida = t.vidaMax;
    t.ativo = true;
    t.estado = 'nadando';
    t.timer = 3500;
    t.setVisible(true).setAlpha(1).setAngle(0);
    this.olhoTubarao.setVisible(true);
    this.donaFala(['Cuidado! 🦈']);
    this.tocarMelodia([220, 196, 175], 0.25, 'sawtooth', 0.08);
    this.mostrarFaixa(`🦈 Aperta ${LETRA} pra lutar!`);
  }

  atualizarTubarao(delta) {
    const t = this.tubarao;
    if (!t.ativo) { this.avisoTubarao.setText(''); return; }
    const f = delta / 16.67;
    t.timer -= delta;
    const dx = this.peixe.x - t.x, dy = this.peixe.y - t.y;
    const d = Math.hypot(dx, dy) || 1;
    let vx = 0, vy = 0;

    if (t.estado === 'nadando') {
      const vel = 1.4 + this.dia * 0.04;
      vx = dx / d * vel; vy = dy / d * vel;
      vy += Math.sin(this.time.now / 300) * 0.4;
      this.avisoTubarao.setText('');
      if (t.timer <= 0 && d < 420) { t.estado = 'preparando'; t.timer = 900; this.tocarSom(300, 0.2, 'square', 0.08); }
    } else if (t.estado === 'preparando') {
      // treme e mostra ❗ antes de dar o bote
      t.x += Math.sin(this.time.now / 25) * 1.5;
      this.avisoTubarao.setText('❗');
      if (t.timer <= 0) { t.estado = 'investida'; t.timer = 650; t.dir = { x: dx / d, y: dy / d }; }
    } else if (t.estado === 'investida') {
      vx = t.dir.x * 7; vy = t.dir.y * 7;
      this.avisoTubarao.setText('');
      if (t.timer <= 0) { t.estado = 'cansado'; t.timer = 2000; }
    } else if (t.estado === 'cansado') {
      // cansadinho: hora boa pra atacar!
      vx = Math.sign(dx) * 0.3;
      this.avisoTubarao.setText('💫');
      if (t.timer <= 0) { t.estado = 'nadando'; t.timer = Phaser.Math.Between(3000, 5000); }
    } else if (t.estado === 'fugindo') {
      vx = t.fugaDir * 9;
      this.avisoTubarao.setText('😵');
      if (t.x < -250 || t.x > W + 250) {
        t.ativo = false;
        t.setVisible(false);
        this.olhoTubarao.setVisible(false);
        this.avisoTubarao.setText('');
        this.barraTubarao.clear();
        return;
      }
    }

    t.x += vx * f;
    t.y += vy * f;
    if (t.estado !== 'fugindo') t.y = Phaser.Math.Clamp(t.y, 140, H - 70);
    if (t.estado !== 'fugindo' && t.estado !== 'nadando') t.x = Phaser.Math.Clamp(t.x, 40, W - 40);
    if (Math.abs(vx) > 0.2) t.scaleX = Math.sign(vx) * t.escala;
    const lado = Math.sign(t.scaleX);
    this.olhoTubarao.setPosition(t.x + 42 * t.escala * lado, t.y - 8 * t.escala);
    this.avisoTubarao.setPosition(t.x, t.y - 62 * t.escala);

    // encostou no peixinho?
    if (t.estado !== 'fugindo') {
      const raio = 52 * t.escala + 14 * this.tamanhoPeixe;
      if (d < raio) {
        if (this.dash && !this.dash.acertou) this.acertarTubarao();
        else if (!this.dash && this.invulneravel <= 0) this.morderPeixe(dx / d, dy / d);
      }
    }
    this.desenharBarraTubarao();
  }

  desenharBarraTubarao() {
    const t = this.tubarao, g = this.barraTubarao;
    g.clear();
    if (!t.ativo || t.estado === 'fugindo') { if (this.iconeBarra) this.iconeBarra.setVisible(false); return; }
    const larg = Math.min(220, W * 0.5), x = W / 2 - larg / 2 + 16, y = this.yBarra;
    if (!this.iconeBarra) this.iconeBarra = this.add.text(0, 0, '🦈', { fontSize: '24px' }).setOrigin(0.5).setDepth(71);
    this.iconeBarra.setPosition(x - 22, y + 7).setVisible(true);
    g.fillStyle(0x000000, 0.4); g.fillRoundedRect(x - 3, y - 3, larg + 6, 20, 9);
    g.fillStyle(0xff4d6d, 1); g.fillRoundedRect(x, y, Math.max(0, larg * t.vida / t.vidaMax), 14, 7);
  }

  acertarTubarao() {
    const t = this.tubarao;
    this.dash.acertou = true;
    t.vida -= this.forca;
    t.x += this.dash.vx * 7;
    t.y += this.dash.vy * 7;
    this.textoFlutuante(t.x, t.y - 40, `💥 -${this.forca}`, '#ffd16f');
    this.tocarSom(180, 0.15, 'square', 0.12);
    this.time.delayedCall(60, () => this.tocarSom(520, 0.12, 'triangle'));
    this.tweens.add({ targets: t, alpha: 0.3, duration: 70, yoyo: true, repeat: 2 });
    if (t.estado === 'preparando') { t.estado = 'cansado'; t.timer = 1200; }
    if (t.vida <= 0) this.vencerTubarao();
  }

  vencerTubarao() {
    this.fugirTubarao();
    this.mostrarFaixa('🎉 Uhuul! Você venceu o tubarão!');
    this.tocarMelodia([523, 659, 784, 1047, 1319, 1568], 0.1, 'triangle');
    this.donaFala(['Muito bem! 🎉']);
    // depois de vencer, amanhece rapidinho
    this.noiteAcabando = true;
    this.faseTempo = Math.min(this.faseTempo, 5000);
  }

  fugirTubarao() {
    const t = this.tubarao;
    t.estado = 'fugindo';
    t.fugaDir = t.x < W / 2 ? -1 : 1;
    t.scaleX = t.fugaDir * t.escala;
  }

  morderPeixe(nx, ny) {
    if (IMUNE) {
      // nome mágico: o tubarão nunca pega!
      this.invulneravel = 1200;
      this.textoFlutuante(this.peixe.x, this.peixe.y - 30, '🛡️ Não me pega!', '#8fe0ff');
      this.tocarSom(1200, 0.1, 'triangle');
      return;
    }
    this.coracoes--;
    this.invulneravel = 2000;
    this.peixe.x = Phaser.Math.Clamp(this.peixe.x + nx * 70, 30, W - 30);
    this.peixe.y = Phaser.Math.Clamp(this.peixe.y + ny * 70, 120, H - 50);
    this.alvo = null;
    this.cameras.main.shake(250, 0.012);
    this.textoFlutuante(this.peixe.x, this.peixe.y - 30, '-1 ❤️', '#ff4d6d');
    this.tocarSom(160, 0.3, 'sawtooth', 0.12);
    // pisca enquanto está protegido
    this.tweens.add({ targets: this.peixe, alpha: 0.3, duration: 150, yoyo: true, repeat: 5, onComplete: () => this.peixe.setAlpha(1) });
    this.salvar();
    this.atualizarHUD();
    if (this.coracoes <= 0) this.morrer();
  }

  // 💥 peixinho dá uma investida rápida (espaço, ou tocar no tubarão)
  atacar(alvoX, alvoY) {
    if (this.fimDeJogo || this.dash || this.recargaDash > 0) return;
    let vx, vy;
    if (alvoX !== undefined) {
      const dx = alvoX - this.peixe.x, dy = alvoY - this.peixe.y, d = Math.hypot(dx, dy) || 1;
      vx = dx / d; vy = dy / d;
    } else if (this.tubarao.ativo && this.tubarao.estado !== 'fugindo') {
      // apertou a letra: vai direto no tubarão
      const dx = this.tubarao.x - this.peixe.x, dy = this.tubarao.y - this.peixe.y, d = Math.hypot(dx, dy) || 1;
      vx = dx / d; vy = dy / d;
    } else {
      vx = this.peixe.scaleX >= 0 ? 1 : -1; vy = 0;
    }
    this.dash = { vx, vy, tempo: 320, acertou: false };
    this.recargaDash = 650;
    this.tocarSom(700, 0.08, 'triangle');
  }

  // ================= COMIDA, FORÇA E OVOS =================

  donaJogaComida() {
    this.tweens.add({ targets: this.poteDona, angle: -20, duration: 200, yoyo: true, ease: 'Sine.easeInOut' });
    const qtd = Phaser.Math.Between(1, 3);
    for (let i = 0; i < qtd; i++) {
      this.time.delayedCall(i * 150, () => {
        const x = Phaser.Math.Clamp(this.dona.x + Phaser.Math.Between(-60, 60), 20, W - 20);
        const c = this.add.circle(x, 90, 7, 0xff8833).setDepth(35);
        c.setStrokeStyle(1, 0xaa4400);
        c.brilho = this.add.circle(x - 2, 88, 2, 0xffdd99).setDepth(35);
        this.comidas.push(c);
        this.tocarSom(440, 0.05);
      });
    }
  }

  comerComida(c) {
    c.brilho.destroy();
    c.destroy();
    this.comeu++;
    this.tocarPlim();
    this.tweens.add({ targets: this.hud2, scale: 1.25, duration: 150, yoyo: true, ease: 'Back.easeOut' });
    this.textoFlutuante(this.peixe.x, this.peixe.y - 20, '💖', '#ffffff');
    if (this.comeu % COMIDAS_POR_OVO === 0) {
      // a cada 5 comidas: fica mais forte e bota um ovinho
      this.forca++;
      this.ajustarTamanhoPeixe(true);
      this.botarOvo();
      this.textoFlutuante(this.peixe.x, this.peixe.y - 50, '💪 Mais forte!', '#ffd16f');
      this.tocarMelodia([659, 784, 988, 1319], 0.08, 'triangle');
    }
    this.salvar();
    this.atualizarHUD();
  }

  ajustarTamanhoPeixe(animar) {
    // cada força deixa o peixinho maior (cresce rápido no começo e devagarinho depois, até ~3x)
    this.tamanhoPeixe = 1 + 2.1 * (1 - Math.exp(-(this.forca - 1) / 10));
    this.peixeCoroa.setVisible(this.forca >= 6);
    const sx = (this.peixe.scaleX >= 0 ? 1 : -1) * this.tamanhoPeixe;
    if (animar) this.tweens.add({ targets: this.peixe, scaleX: sx, scaleY: this.tamanhoPeixe, duration: 300, ease: 'Back.easeOut' });
    else this.peixe.setScale(sx, this.tamanhoPeixe);
  }

  botarOvo() {
    this.ovos++;
    const ovo = this.add.text(this.peixe.x, this.peixe.y, '🥚', { fontSize: '26px' }).setOrigin(0.5).setDepth(32);
    this.tweens.add({
      targets: ovo, y: H - 28, duration: 1500, ease: 'Bounce.easeOut',
      onComplete: () => {
        // depois de um tempinho o ovo choca e nasce um filhote
        this.time.delayedCall(12000, () => {
          if (!ovo.active) return;
          ovo.setText('🐣');
          this.tocarMelodia([1047, 1319], 0.1);
          this.time.delayedCall(1200, () => {
            if (!ovo.active) return;
            this.filhotes++;
            if (this.amigos.length < 16) this.criarFilhote(ovo.x, ovo.y - 30);
            ovo.destroy();
            this.salvar();
            this.atualizarHUD();
          });
        });
      }
    });
  }

  // ================= FIM DE JOGO =================

  morrer() {
    this.fimDeJogo = true;
    this.limparSave();
    this.tocarMelodia([392, 349, 311, 262], 0.25, 'triangle', 0.25);
    this.telaFinal('😵', 'Ai! Acabaram os corações...', 'Vamos de novo!', '#6fb5ff');
  }

  vitoria() {
    this.fimDeJogo = true;
    this.limparSave();
    this.contarHistoria();
  }

  // ================= HISTÓRIA DO PEIXINHO (quando zera o jogo) =================
  // 1) o peixinho cresce dia a dia dentro do aquário pequeno (Dia 1 → Dia 20)
  // 2) no dia 20 ele fica tão grande que não cabe mais
  // 3) a dona traz um aquário novo bem grande e ele pula pra lá
  contarHistoria() {
    const P = 100; // profundidade: por cima de tudo do jogo
    const deitado = W > H * 0.9;
    const legenda = (texto) => {
      this.legendaHist.setText(texto).setScale(0.6);
      this.tweens.add({ targets: this.legendaHist, scale: 1, duration: 350, ease: 'Back.easeOut' });
    };

    this.add.rectangle(W / 2, H / 2, W, H, 0x0b2a4a, 1).setDepth(P).setInteractive();
    for (let i = 0; i < 40; i++) {
      const s = this.add.circle(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), Phaser.Math.Between(1, 3), 0xffffff, 0.6).setDepth(P);
      this.tweens.add({ targets: s, alpha: 0.1, duration: Phaser.Math.Between(600, 1600), yoyo: true, repeat: -1 });
    }
    this.add.text(W / 2, 70, '📖 A história do peixinho', {
      fontSize: PEQUENO ? '24px' : '36px', color: '#ffffff', fontStyle: 'bold', fontFamily: FONTE, stroke: '#b56fff', strokeThickness: 6
    }).setOrigin(0.5).setDepth(P + 5);
    this.legendaHist = this.add.text(W / 2, H * 0.86, '', {
      fontSize: PEQUENO ? '24px' : '34px', color: '#ffffff', fontStyle: 'bold', fontFamily: FONTE, stroke: '#ff6fb5', strokeThickness: 6, align: 'center', wordWrap: { width: W - 40 }
    }).setOrigin(0.5).setDepth(P + 5);

    // aquário pequeno com o peixinho dentro
    const w1 = Math.min(W * 0.62, 340), h1 = w1 * 0.62;
    const aqP = this.criarAquarioDesenho(w1, h1, false).setPosition(W / 2, H * 0.5).setDepth(P + 1);
    const peixe = this.criarPeixeDesenho().setPosition(W / 2, H * 0.5 + 4).setDepth(P + 2);
    const sDia1 = (w1 * 0.16) / 55, sFinal = (w1 * 0.95) / 55;
    peixe.setScale(sDia1);
    peixe.mover = this.tweens.add({ targets: peixe, y: peixe.y - 6, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    // parte 1: um dia de cada vez, crescendo
    const passo = 480;
    for (let d = 1; d <= TOTAL_DIAS; d++) {
      this.time.delayedCall(600 + (d - 1) * passo, () => {
        const s = sDia1 + (sFinal - sDia1) * Math.pow((d - 1) / (TOTAL_DIAS - 1), 1.15);
        this.tweens.add({ targets: peixe, scale: s, duration: passo * 0.8, ease: 'Back.easeOut' });
        legenda(`📅 Dia ${d}`);
        this.tocarSom(440 + d * 30, 0.12, 'triangle', 0.12);
        const b = this.add.text(peixe.x + Phaser.Math.Between(-40, 40), peixe.y - 20, '✨', { fontSize: '20px' }).setOrigin(0.5).setDepth(P + 3);
        this.tweens.add({ targets: b, y: b.y - 50, alpha: 0, duration: 700, onComplete: () => b.destroy() });
      });
    }
    let t = 600 + TOTAL_DIAS * passo + 300;

    // parte 2: ficou super grande, não cabe mais!
    this.time.delayedCall(t, () => {
      legenda('😮 Ele ficou SUPER GRANDE! Não cabe mais!');
      this.tweens.add({ targets: [aqP, peixe], x: '+=6', duration: 60, yoyo: true, repeat: 9 });
      this.tocarMelodia([392, 330, 392, 330], 0.12, 'square', 0.1);
    });
    t += 2600;

    // parte 3: chega um aquário novo bem grande
    const posP = deitado ? { x: W * 0.27, y: H * 0.52 } : { x: W / 2, y: H * 0.3 };
    const w2 = deitado ? Math.min(W * 0.55, 620) : Math.min(W * 0.92, 560), h2 = w2 * 0.62;
    const posG = deitado ? { x: W * 0.69, y: H * 0.55 } : { x: W / 2, y: H * 0.64 };
    let aqG;
    this.time.delayedCall(t, () => {
      legenda('🎁 A dona trouxe um aquário novo!');
      this.tweens.add({ targets: [aqP, peixe], x: posP.x, y: posP.y, duration: 900, ease: 'Sine.easeInOut' });
      aqG = this.criarAquarioDesenho(w2, h2, true).setPosition(W + w2, posG.y).setDepth(P + 1);
      this.tweens.add({ targets: aqG, x: posG.x, duration: 1200, delay: 300, ease: 'Back.easeOut' });
      // a dona aparece do lado do aquário novo
      this.dona.setDepth(P + 4).setPosition(W + 80, posG.y - h2 / 2 - 30);
      this.poteDona.setVisible(false);
      this.lanterna.setVisible(false);
      this.donaAlvo = { x: Math.min(W - 40, posG.x + w2 * 0.42), y: posG.y - h2 / 2 - 40 };
      this.tocarMelodia([523, 659, 784], 0.12);
    });
    t += 2400;

    // parte 4: o peixinho pula pro aquário novo
    this.time.delayedCall(t, () => {
      legenda('🐠 Pula, peixinho!');
      peixe.mover.stop();
      const de = { x: peixe.x, y: peixe.y };
      const alt = deitado ? H * 0.28 : H * 0.12;
      this.tweens.addCounter({
        from: 0, to: 1, duration: 1300, ease: 'Sine.easeInOut',
        onUpdate: (tw) => {
          const k = tw.getValue();
          peixe.x = de.x + (posG.x - de.x) * k;
          peixe.y = de.y + (posG.y + 6 - de.y) * k - Math.sin(k * Math.PI) * alt;
          peixe.angle = (k - 0.5) * 70 * (posG.x >= de.x ? 1 : -1) + (deitado ? 0 : 0);
        },
        onComplete: () => {
          peixe.angle = 0;
          this.respingo(posG.x, posG.y - h2 * 0.3, P + 3);
          this.tocarSom(300, 0.2, 'sine', 0.2);
          this.time.delayedCall(120, () => this.tocarPlim());
          // agora ele nada feliz no aquário grande
          this.tweens.add({ targets: peixe, x: posG.x + w2 * 0.12, duration: 1400, yoyo: true, repeat: -1, ease: 'Sine.easeInOut',
            onYoyo: () => { peixe.scaleX = -Math.abs(peixe.scaleX); }, onRepeat: () => { peixe.scaleX = Math.abs(peixe.scaleX); } });
          this.tweens.add({ targets: aqP, alpha: 0.35, duration: 800 });
        }
      });
      this.tocarMelodia([523, 659, 784, 1047], 0.25, 'triangle');
    });
    t += 2200;

    this.time.delayedCall(t, () => {
      legenda('🏠 Casa nova! Uhuul!');
      this.tocarMelodia([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.15, 'triangle', 0.2);
      for (let i = 0; i < 40; i++) {
        const c = this.add.text(Phaser.Math.Between(0, W), -30, Phaser.Utils.Array.GetRandom(['🎉', '⭐', '💖', '🐠', '✨']), { fontSize: '28px' }).setDepth(P + 20);
        this.tweens.add({ targets: c, y: H + 40, angle: 360, duration: Phaser.Math.Between(2000, 4000), delay: Phaser.Math.Between(0, 1500), onComplete: () => c.destroy() });
      }
    });
    t += 4000;

    this.time.delayedCall(t, () => this.telaFinal('🏆', 'Você zerou o jogo! 20 dias!', 'Jogar de novo!', '#ffd16f', P + 10));
  }

  criarPeixeDesenho() {
    const c = this.add.container(0, 0);
    const g = this.add.graphics();
    this.desenharPeixe(g, 0xff6fb5, 0xff9bd3);
    c.add([g, this.add.circle(8, -3, 4, 0xffffff), this.add.circle(9, -3, 2, 0x222222),
      this.add.text(2, -22, '👑', { fontSize: '14px' }).setOrigin(0.5)]);
    return c;
  }

  criarAquarioDesenho(w, h, grande) {
    const c = this.add.container(0, 0);
    const g = this.add.graphics();
    // água
    g.fillStyle(0x6fc8ff, 0.9);
    g.fillRoundedRect(-w / 2, -h / 2 + 10, w, h - 10, 12);
    g.fillStyle(0xffffff, 0.15);
    g.fillRect(-w / 2 + 12, -h / 2 + 16, w * 0.08, h - 30);
    // areia
    g.fillStyle(0xffe9b0, 1);
    g.fillRoundedRect(-w / 2, h / 2 - h * 0.16, w, h * 0.16, { tl: 0, tr: 0, bl: 12, br: 12 });
    // plantinhas e pedrinhas
    const n = grande ? 6 : 3;
    for (let i = 0; i < n; i++) {
      const x = -w / 2 + (i + 0.5) * (w / n);
      g.fillStyle(i % 2 ? 0x5ec97f : 0x3fa86a, 1);
      for (let k = 0; k < 3; k++) g.fillEllipse(x + Math.sin(k) * 5, h / 2 - h * 0.14 - k * 14, 12 - k * 2, 22);
      g.fillStyle([0xff9bd3, 0xb56fff, 0xffd16f][i % 3], 1);
      g.fillCircle(x + 18, h / 2 - h * 0.08, 5);
    }
    // vidro e borda de cima
    g.lineStyle(5, 0xffffff, 0.9);
    g.strokeRoundedRect(-w / 2, -h / 2, w, h, 14);
    g.fillStyle(grande ? 0xb56fff : 0xff6fb5, 1);
    g.fillRoundedRect(-w / 2 - 6, -h / 2 - 6, w + 12, 12, 6);
    c.add(g);
    if (grande) c.add(this.add.text(0, h / 2 + 22, '⭐ ⭐ ⭐', { fontSize: '20px' }).setOrigin(0.5));
    return c;
  }

  respingo(x, y, prof) {
    for (let i = 0; i < 14; i++) {
      const gota = this.add.circle(x, y, Phaser.Math.Between(4, 9), 0xbfe9ff).setDepth(prof);
      const ang = Phaser.Math.FloatBetween(-Math.PI * 0.9, -Math.PI * 0.1);
      const dist = Phaser.Math.Between(50, 120);
      this.tweens.add({ targets: gota, x: x + Math.cos(ang) * dist, y: y + Math.sin(ang) * dist, alpha: 0, duration: 700, ease: 'Quad.easeOut', onComplete: () => gota.destroy() });
    }
  }

  telaFinal(emoji, texto, botao, cor, prof = 90) {
    const fundo = this.add.rectangle(W / 2, H / 2, W, H, 0x001a33, 0.75).setDepth(prof).setInteractive();
    const e = this.add.text(W / 2, H / 2 - 110, emoji, { fontSize: '90px' }).setOrigin(0.5).setDepth(prof + 1);
    const t = this.add.text(W / 2, H / 2, texto, { fontSize: PEQUENO ? '24px' : '34px', color: '#ffffff', fontStyle: 'bold', fontFamily: FONTE, stroke: '#b56fff', strokeThickness: 6, align: 'center', wordWrap: { width: W - 40 } }).setOrigin(0.5).setDepth(prof + 1);
    const b = this.add.text(W / 2, H / 2 + 100, botao, { fontSize: '30px', color: '#ffffff', fontStyle: 'bold', fontFamily: FONTE, backgroundColor: cor, padding: { x: 24, y: 14 } }).setOrigin(0.5).setDepth(prof + 1).setInteractive({ useHandCursor: true });
    this.tweens.add({ targets: [e, b], scale: 1.1, duration: 600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    b.on('pointerdown', () => this.scene.restart());
  }

  // ================= SALVAR =================

  salvar() {
    try {
      localStorage.setItem(CHAVE, JSON.stringify({ dia: this.dia, coracoes: this.coracoes, comeu: this.comeu, forca: this.forca, ovos: this.ovos, filhotes: this.filhotes }));
    } catch (e) {}
  }
  carregar() {
    try {
      const s = JSON.parse(localStorage.getItem(CHAVE) || 'null');
      if (!s || !(s.coracoes > 0)) return;
      this.dia = Phaser.Math.Clamp(s.dia | 0, 1, TOTAL_DIAS);
      this.coracoes = Phaser.Math.Clamp(s.coracoes | 0, 1, TOTAL_CORACOES);
      this.comeu = Math.max(0, s.comeu | 0);
      this.forca = Math.max(1, s.forca | 0);
      this.ovos = Math.max(0, s.ovos | 0);
      this.filhotes = Math.max(0, s.filhotes | 0);
    } catch (e) {}
  }
  limparSave() { try { localStorage.removeItem(CHAVE); } catch (e) {} }

  // ================= TELA =================

  atualizarHUD() {
    const falta = COMIDAS_POR_OVO - (this.comeu % COMIDAS_POR_OVO);
    const bolinhas = '●'.repeat(COMIDAS_POR_OVO - falta) + '○'.repeat(falta);
    this.hud1.setText(`🐠 ${NOME}   📅 Dia ${this.dia}/${TOTAL_DIAS}   ${IMUNE ? '🛡️' : '❤️'} ${this.coracoes}`);
    this.hud2.setText(`🍤 ${this.comeu} ${bolinhas}   💪 ${this.forca}   🥚 ${this.ovos}`);
  }

  mostrarFaixa(texto) {
    const t = this.add.text(W / 2, H / 2 - 40, texto, {
      fontSize: PEQUENO ? '26px' : '40px', color: '#ffffff', fontStyle: 'bold', fontFamily: FONTE, stroke: '#b56fff', strokeThickness: 7, align: 'center', wordWrap: { width: W - 40 }
    }).setOrigin(0.5).setDepth(80).setScale(0.3);
    this.tweens.add({ targets: t, scale: 1, duration: 400, ease: 'Back.easeOut' });
    this.tweens.add({ targets: t, alpha: 0, delay: 2400, duration: 600, onComplete: () => t.destroy() });
  }

  textoFlutuante(x, y, texto, cor) {
    const t = this.add.text(x, y, texto, { fontSize: '24px', color: cor, fontStyle: 'bold', fontFamily: FONTE, stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5).setDepth(75);
    this.tweens.add({ targets: t, y: y - 50, alpha: 0, duration: 1000, onComplete: () => t.destroy() });
  }

  donaFala(falas) {
    this.balaoTexto.setText(Phaser.Utils.Array.GetRandom(falas));
    this.tweens.killTweensOf(this.nuvem);
    this.nuvem.setAlpha(0);
    this.tweens.add({ targets: this.nuvem, alpha: 1, duration: 300, yoyo: true, hold: 1800 });
  }

  // ================= SONS =================

  tocarSom(freq, duracao = 0.1, tipo = 'sine', vol = 0.2) {
    try {
      if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      osc.type = tipo;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, this.audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + duracao);
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      osc.start();
      osc.stop(this.audioCtx.currentTime + duracao);
    } catch (e) {}
  }
  tocarPlim() {
    this.tocarSom(880, 0.1);
    this.time.delayedCall(80, () => this.tocarSom(1320, 0.12));
  }
  tocarMelodia(notas, passo = 0.1, tipo = 'sine', dur = 0.14) {
    notas.forEach((n, i) => this.time.delayedCall(i * passo * 1000, () => this.tocarSom(n, dur, tipo, 0.15)));
  }

  // ================= LOOP =================

  update(time, delta) {
    // dona se move suavemente pro lugar dela
    this.dona.x += (this.donaAlvo.x - this.dona.x) * 0.05;
    this.dona.y += (this.donaAlvo.y - this.dona.y) * 0.05;
    this.nuvem.setPosition(Phaser.Math.Clamp(this.dona.x - 110, 80, W - 80), this.dona.y + 4);
    this.desenharEscuro();

    // peixinhos amigos e filhotes nadam
    for (const a of this.amigos) {
      a.x += a.dirX * a.velocidade;
      if (a.x < 30 || a.x > W - 30) { a.dirX *= -1; a.scaleX = a.dirX * a.escala; }
      a.y += Math.sin(time / 500 + a.x) * 0.4;
    }

    // botão da letra pra lutar: só aparece quando o tubarão está lá
    const mostrarBotao = !this.fimDeJogo && this.tubarao.ativo && this.tubarao.estado !== 'fugindo';
    if (mostrarBotao !== this.botaoVisivel) {
      this.botaoVisivel = mostrarBotao;
      document.getElementById('btn-atacar').style.display = mostrarBotao ? 'block' : 'none';
    }

    if (this.fimDeJogo) return;
    if (this.fase !== 'fim') this.atualizarTempo(delta);

    const f = delta / 16.67;
    this.invulneravel -= delta;
    this.recargaDash -= delta;

    // movimento do peixe
    let vx = 0, vy = 0;
    if (this.dash) {
      vx = this.dash.vx * 11; vy = this.dash.vy * 11;
      this.dash.tempo -= delta;
      if (this.dash.tempo <= 0) this.dash = null;
    } else {
      if (this.cursors.left.isDown) vx = -3.5;
      if (this.cursors.right.isDown) vx = 3.5;
      if (this.cursors.up.isDown) vy = -3.5;
      if (this.cursors.down.isDown) vy = 3.5;
      if (this.alvo && vx === 0 && vy === 0) {
        const dx = this.alvo.x - this.peixe.x, dy = this.alvo.y - this.peixe.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 5) { vx = dx / dist * 3.5; vy = dy / dist * 3.5; }
      }
    }
    this.peixe.x = Phaser.Math.Clamp(this.peixe.x + vx * f, 30, W - 30);
    this.peixe.y = Phaser.Math.Clamp(this.peixe.y + vy * f, 120, H - 50);
    if (vx > 0.1) this.peixe.scaleX = this.tamanhoPeixe;
    if (vx < -0.1) this.peixe.scaleX = -this.tamanhoPeixe;
    if (Math.abs(vx) < 0.1 && Math.abs(vy) < 0.1) this.peixe.y += Math.sin(time / 400) * 0.3;

    this.atualizarTubarao(delta);

    // comidas caem e checam se o peixinho pegou
    for (let i = this.comidas.length - 1; i >= 0; i--) {
      const c = this.comidas[i];
      c.y += 1.2 * f;
      c.x += Math.sin((time + i * 100) / 300) * 0.5;
      c.brilho.setPosition(c.x - 2, c.y - 2);
      if (Phaser.Math.Distance.Between(c.x, c.y, this.peixe.x, this.peixe.y) < 22 * this.tamanhoPeixe) {
        this.comidas.splice(i, 1);
        this.comerComida(c);
      } else if (c.y > H - 30) {
        c.brilho.destroy();
        c.destroy();
        this.comidas.splice(i, 1);
      }
    }
  }
}

// ===== tela de escolher o nome (aparece toda vez que entra no jogo) =====
const CHAVE_NOME = 'jp-aquario-nome';
const caixaNome = document.getElementById('nome');
try { caixaNome.value = localStorage.getItem(CHAVE_NOME) || ''; } catch (e) {}
function comecarJogo() {
  const nome = caixaNome.value.trim().slice(0, 12);
  if (!nome) {
    caixaNome.classList.remove('balanca'); void caixaNome.offsetWidth; caixaNome.classList.add('balanca');
    caixaNome.focus();
    return;
  }
  NOME = nome;
  LETRA = semAcento(nome)[0];
  IMUNE = NOMES_MAGICOS.includes(semAcento(nome));
  try { localStorage.setItem(CHAVE_NOME, nome); } catch (e) {}
  caixaNome.blur();
  document.getElementById('tela-nome').style.display = 'none';
  const btn = document.getElementById('btn-atacar');
  btn.textContent = LETRA;
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); const s = window.jogo && window.jogo.scene.scenes[0]; if (s && s.atacar) s.atacar(); });
  window.jogo = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: W,
    height: H,
    backgroundColor: '#6fc8ff',
    scene: [Aquario],
    scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH }
  });
}
document.getElementById('btn-jogar').addEventListener('click', comecarJogo);
caixaNome.addEventListener('keydown', (e) => { if (e.key === 'Enter') comecarJogo(); });
</script>
