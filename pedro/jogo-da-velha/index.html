<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Jogo da Velha</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      min-height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
    }
    #voltar {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.4);
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
    }
    h1 {
      margin: 40px 0 8px;
      font-size: 28px;
      letter-spacing: 1px;
    }
    .escondido { display: none !important; }

    /* Tela de escolha de modo */
    #tela-modo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 30px;
    }
    #tela-modo .subtitulo {
      font-size: 18px;
      opacity: 0.8;
      margin-bottom: 8px;
    }
    .opcoes-modo {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .botao-modo {
      background: #232342;
      border: 2px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 24px 28px;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      min-width: 200px;
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .botao-modo .emoji { font-size: 48px; }
    .botao-modo .desc {
      font-size: 13px;
      font-weight: 400;
      opacity: 0.7;
    }
    .botao-modo:hover {
      transform: translateY(-4px);
      background: #2c2c52;
      border-color: #4f9bff;
    }
    .botao-modo.robo:hover { border-color: #ff4f6f; }

    /* Placar */
    .placar {
      display: flex;
      gap: 12px;
      margin: 8px 0 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .placar .item {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px;
      border-radius: 12px;
      text-align: center;
      min-width: 80px;
    }
    .placar .item .rotulo {
      font-size: 12px;
      opacity: 0.7;
      letter-spacing: 1px;
    }
    .placar .item .valor {
      font-size: 22px;
      font-weight: bold;
      margin-top: 2px;
    }
    .placar .x .valor { color: #4f9bff; }
    .placar .o .valor { color: #ff4f6f; }
    .placar .empate .valor { color: #aaa; }

    #status {
      font-size: 20px;
      margin: 4px 0 16px;
      min-height: 28px;
      text-align: center;
    }
    #status .marca-x { color: #4f9bff; font-weight: bold; }
    #status .marca-o { color: #ff4f6f; font-weight: bold; }

    #tabuleiro {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: min(90vw, 420px);
      aspect-ratio: 1 / 1;
      background: rgba(255,255,255,0.05);
      padding: 8px;
      border-radius: 16px;
      position: relative;
    }
    .celula {
      background: #232342;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(48px, 14vw, 88px);
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, transform 0.1s;
      border: 2px solid transparent;
    }
    .celula:hover:not(.preenchida) {
      background: #2c2c52;
      transform: scale(1.02);
    }
    .celula.preenchida { cursor: default; }
    .celula.x { color: #4f9bff; }
    .celula.o { color: #ff4f6f; }
    .celula.vitoria {
      background: #3a3a6e;
      border-color: #ffd84f;
      animation: piscar 0.6s ease infinite alternate;
    }
    @keyframes piscar {
      from { box-shadow: 0 0 0 0 rgba(255,216,79,0.4); }
      to   { box-shadow: 0 0 24px 4px rgba(255,216,79,0.6); }
    }

    .botoes {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #4f9bff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.96); }
    button.secundario { background: rgba(255,255,255,0.1); }

    .shake { animation: tremer 0.4s; }
    @keyframes tremer {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
  </style>
</head>
<body>
  <a id="voltar" href="../">← voltar</a>

  <h1>⭕ Jogo da Velha ❌</h1>

  <!-- Tela inicial: escolher modo -->
  <div id="tela-modo">
    <div class="subtitulo">Escolha o modo:</div>
    <div class="opcoes-modo">
      <button class="botao-modo" data-modo="humano">
        <div class="emoji">👥</div>
        <div>2 jogadores</div>
        <div class="desc">No mesmo aparelho</div>
      </button>
      <button class="botao-modo robo" id="abrir-dificuldade">
        <div class="emoji">🤖</div>
        <div>Contra o robô</div>
        <div class="desc">Escolha a dificuldade</div>
      </button>
    </div>
  </div>

  <!-- Tela de escolha de dificuldade -->
  <div id="tela-dificuldade" class="escondido" style="display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 30px;">
    <div class="subtitulo" style="font-size: 18px; opacity: 0.8;">Qual a dificuldade do robô?</div>
    <div class="opcoes-modo">
      <button class="botao-modo" data-dificuldade="facil" style="border-color: rgba(79, 219, 155, 0.4);">
        <div class="emoji">😊</div>
        <div>Fácil</div>
        <div class="desc">Joga aleatório</div>
      </button>
      <button class="botao-modo" data-dificuldade="medio" style="border-color: rgba(255, 216, 79, 0.4);">
        <div class="emoji">🤔</div>
        <div>Médio</div>
        <div class="desc">Ataca e defende, mas erra</div>
      </button>
      <button class="botao-modo robo" data-dificuldade="dificil">
        <div class="emoji">😈</div>
        <div>Difícil</div>
        <div class="desc">Imbatível (minimax)</div>
      </button>
    </div>
    <button id="voltar-modo" class="secundario">← voltar</button>
  </div>

  <!-- Tela do jogo -->
  <div id="tela-jogo" class="escondido" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
    <div class="placar">
      <div class="item x">
        <div class="rotulo" id="rotulo-x">X</div>
        <div class="valor" id="placar-x">0</div>
      </div>
      <div class="item empate">
        <div class="rotulo">EMPATES</div>
        <div class="valor" id="placar-empate">0</div>
      </div>
      <div class="item o">
        <div class="rotulo" id="rotulo-o">O</div>
        <div class="valor" id="placar-o">0</div>
      </div>
    </div>

    <div id="status">Vez do <span class="marca-x">X</span></div>

    <div id="tabuleiro"></div>

    <div class="botoes">
      <button id="nova-rodada">Nova rodada</button>
      <button id="zerar-placar" class="secundario">Zerar placar</button>
      <button id="trocar-modo" class="secundario">Trocar modo</button>
    </div>
  </div>

  <script>
    // ---------- Estado ----------
    let tabuleiro = ["", "", "", "", "", "", "", "", ""];
    let vezDe = "X";
    let acabou = false;
    let modo = "humano"; // "humano" ou "robo"
    let dificuldade = "dificil"; // "facil", "medio", "dificil"

    // Placar separado por modo (cada modo tem seu próprio histórico)
    let placar = { X: 0, O: 0, empate: 0 };

    const linhasVitoria = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6],
    ];

    // ---------- Elementos ----------
    const elTelaModo = document.getElementById("tela-modo");
    const elTelaDificuldade = document.getElementById("tela-dificuldade");
    const elTelaJogo = document.getElementById("tela-jogo");
    const elTabuleiro = document.getElementById("tabuleiro");
    const elStatus = document.getElementById("status");
    const elPlacarX = document.getElementById("placar-x");
    const elPlacarO = document.getElementById("placar-o");
    const elPlacarEmpate = document.getElementById("placar-empate");
    const elRotuloX = document.getElementById("rotulo-x");
    const elRotuloO = document.getElementById("rotulo-o");

    // ---------- Escolha de modo ----------
    document.querySelectorAll("#tela-modo .botao-modo[data-modo]").forEach(btn => {
      btn.addEventListener("click", () => iniciarModo(btn.dataset.modo));
    });

    document.getElementById("abrir-dificuldade").addEventListener("click", () => {
      elTelaModo.classList.add("escondido");
      elTelaDificuldade.classList.remove("escondido");
    });

    document.getElementById("voltar-modo").addEventListener("click", () => {
      elTelaDificuldade.classList.add("escondido");
      elTelaModo.classList.remove("escondido");
    });

    document.querySelectorAll("#tela-dificuldade .botao-modo").forEach(btn => {
      btn.addEventListener("click", () => {
        dificuldade = btn.dataset.dificuldade;
        elTelaDificuldade.classList.add("escondido");
        iniciarModo("robo");
      });
    });

    function iniciarModo(novoModo) {
      modo = novoModo;
      carregarPlacar();

      // Rótulos do placar muda no modo robô
      if (modo === "robo") {
        elRotuloX.textContent = "VOCÊ (X)";
        const emojiDif = { facil: "😊", medio: "🤔", dificil: "😈" }[dificuldade];
        elRotuloO.textContent = `ROBÔ ${emojiDif}`;
      } else {
        elRotuloX.textContent = "X";
        elRotuloO.textContent = "O";
      }

      elTelaModo.classList.add("escondido");
      elTelaJogo.classList.remove("escondido");

      tabuleiro = ["", "", "", "", "", "", "", "", ""];
      vezDe = "X";
      acabou = false;
      montarTabuleiro();
      atualizarPlacar();
      atualizarStatus();
    }

    function voltarParaModo() {
      elTelaJogo.classList.add("escondido");
      elTelaModo.classList.remove("escondido");
    }

    // ---------- Tabuleiro ----------
    function montarTabuleiro() {
      elTabuleiro.innerHTML = "";
      for (let i = 0; i < 9; i++) {
        const celula = document.createElement("div");
        celula.className = "celula";
        celula.dataset.indice = i;
        celula.addEventListener("click", () => jogarHumano(i));
        elTabuleiro.appendChild(celula);
      }
    }

    function jogarHumano(indice) {
      if (acabou) return;
      if (tabuleiro[indice] !== "") return;
      // No modo robô, jogador humano só joga quando é a vez do X
      if (modo === "robo" && vezDe !== "X") return;

      executarJogada(indice, vezDe);
    }

    function executarJogada(indice, marca) {
      tabuleiro[indice] = marca;
      const celula = elTabuleiro.children[indice];
      celula.textContent = marca;
      celula.classList.add("preenchida", marca.toLowerCase());

      const vencedor = checarVitoria(tabuleiro);
      if (vencedor) return finalizarVitoria(vencedor);
      if (tabuleiro.every(c => c !== "")) return finalizarEmpate();

      vezDe = vezDe === "X" ? "O" : "X";
      atualizarStatus();

      // Vez do robô?
      if (modo === "robo" && vezDe === "O" && !acabou) {
        setTimeout(jogarRobo, 400); // pequena pausa pra parecer que ele "pensa"
      }
    }

    // ---------- Robô ----------
    function jogarRobo() {
      let indice;
      if (dificuldade === "facil") {
        indice = jogadaAleatoria(tabuleiro);
      } else if (dificuldade === "medio") {
        indice = jogadaMedia(tabuleiro);
      } else {
        indice = melhorJogada(tabuleiro, "O");
      }
      executarJogada(indice, "O");
    }

    // Fácil: escolhe uma casa vazia qualquer
    function jogadaAleatoria(estado) {
      const vazias = [];
      for (let i = 0; i < 9; i++) if (estado[i] === "") vazias.push(i);
      return vazias[Math.floor(Math.random() * vazias.length)];
    }

    // Médio: 1) se pode ganhar agora, ganha. 2) se o adversário ia ganhar
    // na próxima, bloqueia. 3) caso contrário, joga aleatório.
    // Não usa estratégia profunda — dá pra ganhar dele com forks.
    function jogadaMedia(estado) {
      // Tenta ganhar
      const ganhar = jogadaQueVence(estado, "O");
      if (ganhar !== -1) return ganhar;
      // Bloqueia
      const bloqueio = jogadaQueVence(estado, "X");
      if (bloqueio !== -1) return bloqueio;
      // Aleatório
      return jogadaAleatoria(estado);
    }

    function jogadaQueVence(estado, jogador) {
      for (let i = 0; i < 9; i++) {
        if (estado[i] === "") {
          estado[i] = jogador;
          const venceu = checarVitoria(estado);
          estado[i] = "";
          if (venceu && venceu.jogador === jogador) return i;
        }
      }
      return -1;
    }

    // Difícil: minimax. Olha TODAS as jogadas até o fim do jogo e escolhe
    // a melhor assumindo que o adversário também joga o melhor possível.
    // Por isso é imbatível.

    function melhorJogada(estado, jogador) {
      let melhorPontos = -Infinity;
      let melhorIndice = -1;
      for (let i = 0; i < 9; i++) {
        if (estado[i] === "") {
          estado[i] = jogador;
          const pontos = minimax(estado, false);
          estado[i] = "";
          if (pontos > melhorPontos) {
            melhorPontos = pontos;
            melhorIndice = i;
          }
        }
      }
      return melhorIndice;
    }

    function minimax(estado, vezDoRobo) {
      const v = checarVitoria(estado);
      if (v) return v.jogador === "O" ? 10 : -10;
      if (estado.every(c => c !== "")) return 0; // velha

      if (vezDoRobo) {
        let melhor = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (estado[i] === "") {
            estado[i] = "O";
            melhor = Math.max(melhor, minimax(estado, false));
            estado[i] = "";
          }
        }
        return melhor;
      } else {
        let pior = Infinity;
        for (let i = 0; i < 9; i++) {
          if (estado[i] === "") {
            estado[i] = "X";
            pior = Math.min(pior, minimax(estado, true));
            estado[i] = "";
          }
        }
        return pior;
      }
    }

    // ---------- Verificações ----------
    function checarVitoria(estado) {
      for (const [a, b, c] of linhasVitoria) {
        if (estado[a] && estado[a] === estado[b] && estado[b] === estado[c]) {
          return { jogador: estado[a], linha: [a, b, c] };
        }
      }
      return null;
    }

    function finalizarVitoria({ jogador, linha }) {
      acabou = true;
      placar[jogador]++;
      salvarPlacar();
      atualizarPlacar();

      linha.forEach(i => elTabuleiro.children[i].classList.add("vitoria"));

      let texto;
      if (modo === "robo") {
        texto = jogador === "X" ? "Você venceu! 🎉" : "O robô venceu! 🤖";
      } else {
        texto = `<span class="marca-${jogador.toLowerCase()}">${jogador}</span> venceu! 🎉`;
      }
      elStatus.innerHTML = texto;
      elTabuleiro.classList.add("shake");
      setTimeout(() => elTabuleiro.classList.remove("shake"), 400);
    }

    function finalizarEmpate() {
      acabou = true;
      placar.empate++;
      salvarPlacar();
      atualizarPlacar();
      elStatus.textContent = "Deu velha! 🤝";
    }

    // ---------- Status / Placar ----------
    function atualizarStatus() {
      if (modo === "robo") {
        elStatus.innerHTML = vezDe === "X"
          ? `Sua vez (<span class="marca-x">X</span>)`
          : `Robô pensando... 🤖`;
      } else {
        elStatus.innerHTML = `Vez do <span class="marca-${vezDe.toLowerCase()}">${vezDe}</span>`;
      }
    }

    function atualizarPlacar() {
      elPlacarX.textContent = placar.X;
      elPlacarO.textContent = placar.O;
      elPlacarEmpate.textContent = placar.empate;
    }

    function chavePlacar() {
      return modo === "robo" ? `velha-robo-${dificuldade}` : "velha-humano";
    }

    function carregarPlacar() {
      const salvo = localStorage.getItem(chavePlacar());
      placar = salvo ? JSON.parse(salvo) : { X: 0, O: 0, empate: 0 };
    }

    function salvarPlacar() {
      localStorage.setItem(chavePlacar(), JSON.stringify(placar));
    }

    function novaRodada() {
      tabuleiro = ["", "", "", "", "", "", "", "", ""];
      acabou = false;
      // No modo robô o humano (X) sempre começa. No modo humano alterna.
      vezDe = modo === "robo" ? "X" : (vezDe === "X" ? "O" : "X");
      montarTabuleiro();
      atualizarStatus();
    }

    function zerarPlacar() {
      if (!confirm("Zerar o placar deste modo?")) return;
      placar = { X: 0, O: 0, empate: 0 };
      salvarPlacar();
      atualizarPlacar();
    }

    document.getElementById("nova-rodada").addEventListener("click", novaRodada);
    document.getElementById("zerar-placar").addEventListener("click", zerarPlacar);
    document.getElementById("trocar-modo").addEventListener("click", voltarParaModo);
  </script>
</body>
</html>
